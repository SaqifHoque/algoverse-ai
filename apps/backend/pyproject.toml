[project]
name = "algoverse-backend"
version = "0.1.0"
description = "AlgoVerse AI backend: execution engine, AST analysis, local LLM lesson planner"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "greenlet>=3.1.1",
    "alembic>=1.13.3",
    "redis>=5.0.8",
    "httpx>=0.27.2",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
markers = ["integration: requires a real local Ollama instance"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
