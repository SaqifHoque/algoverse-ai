services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algoverse
      POSTGRES_USER: algoverse
      POSTGRES_PASSWORD: algoverse_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoverse"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://algoverse:algoverse_dev@postgres:5432/algoverse
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    mem_limit: 1g
    cpus: 1.5
    volumes:
      - ./apps/backend:/app

  frontend:
    build:
      context: ./apps/frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
      API_BASE_URL_INTERNAL: "http://backend:8000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
